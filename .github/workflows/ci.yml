name: CI

on:
  push:
    branches: [main, develop]
  # Sem filtro de `branches` no pull_request: o CI roda em PR para QUALQUER
  # base (inclusive branches `claude/**`), para nunca mais ficar OFF em silencio.
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: missas_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/missas_test

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v2
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate Prisma schema
        run: pnpm db:validate

      - name: Generate Prisma client
        run: pnpm db:generate

      # @missas/shared expoe `main`/`types` a partir de dist/; api (typecheck e
      # test) importa dele. Precisa estar compilado antes de lint/typecheck/test.
      - name: Build shared package
        run: pnpm build:shared

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm typecheck

      - name: Test
        run: pnpm test
